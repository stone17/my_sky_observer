# Default Settings for My Sky Observer
# DO NOT EDIT THIS FILE DIRECTLY.
# User overrides are saved in settings_user.yaml

telescope:
  focal_length: 1000  # Default focal length in mm

camera:
  sensor_width: 23.5  # APS-C width in mm
  sensor_height: 15.7 # APS-C height in mm

location:
  latitude: 51.50
  longitude: 0.12
  city_name: "London"

catalogs:
- abell
- barnard
- berkeley
- chandra_snr
- collinder
- ic
- messier
- ngc
- others
- pk
- ruprecht
- sharpless
- ugc

min_altitude: 30.0
sort_key: "time"
image_padding: 1.15
nina_host: ""

active_profile: null

profiles: {}

image_server:
  resolution: 1024
  timeout: 120
  source: "dss2r"

client_settings:
  max_magnitude: 12.0
  min_size: 0.0
  min_hours: 0.0
  selected_types: []
  filter_active_alt: true
  filter_na_alt: true
  filter_active_hours: true
  filter_na_hours: true
  filter_active_mag: true
  filter_na_mag: true
  filter_active_size: true
  filter_na_size: true

